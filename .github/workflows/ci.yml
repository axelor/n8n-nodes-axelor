name: CI

on:
  pull_request:
  push:
    branches:
      - main

# Cancel in-progress runs for the same branch/PR to avoid wasting CI minutes.
concurrency:
  group: ci-$
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          # Pinned: n8n supports Node 24, and the lts/* alias now resolves to
          # Node 26, where the unused native dev dependency isolated-vm
          # (pulled in by @n8n/node-cli) fails to compile.
          node-version: 24
          cache: 'npm'

      - name: Install dependencies
        # --ignore-scripts: skip native builds of dev dependencies that lint,
        # build and tests do not need.
        run: 'npm ci --ignore-scripts'

      - name: Run lint
        run: 'npm run lint'

      - name: Run build
        run: 'npm run build'

      - name: Run tests
        run: 'npm test'
